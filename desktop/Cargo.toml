[package]
name = "homemusic-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compact desktop player for HomeMusic"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
libmpv2 = "7"
libmpv2-sys = "4"
md-5 = "0.10"
serde_json = "1"
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
url = "2"
toml = "1.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }

[build-dependencies]
pkg-config = "0.3"
slint-build = "1.18"
