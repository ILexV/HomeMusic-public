[package]
name = "homemusic-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compact desktop player for HomeMusic"

[dependencies]
libc = "0.2"
libmpv2 = "7"
md-5 = "0.10"
serde_json = "1"
slint = "1.18"
ureq = { version = "2", default-features = false, features = ["json"] }

[build-dependencies]
pkg-config = "0.3"
slint-build = "1.18"
